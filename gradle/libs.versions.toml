[versions]
kotlin = "2.4.10"
logback = "1.5.34"
prometheus = "0.16.0"
logback-encoder = "8.0"
kafka = "3.9.1"
opentelemetry = "2.8.0"
mockk = "1.13.12"
syfo-xml-codegen = "2.0.1"
jaxb-runtime = "2.4.0-b180830.0438"
jaxb-api = "2.4.0-b180830.0359"
java-time-adapter = "1.1.3"
tsm-sykmeldinger-input = "29"
kotlinx-coroutines = "1.9.0"

[libraries]
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logback-encoder" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
prometheus-simpleclient-hotspot = { module = "io.prometheus:simpleclient_hotspot", version.ref = "prometheus" }
prometheus-simpleclient-common = { module = "io.prometheus:simpleclient_common", version.ref = "prometheus" }
opentelemetry-instrumentation-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations", version.ref = "opentelemetry" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
syfo-xml-codegen-sm2013 = { module = "no.nav.helse.xml:sm2013", version.ref = "syfo-xml-codegen" }
syfo-xml-codegen-xmlfellesformat = { module = "no.nav.helse.xml:xmlfellesformat", version.ref = "syfo-xml-codegen" }
syfo-xml-codegen-kith-hodemelding = { module = "no.nav.helse.xml:kith-hodemelding", version.ref = "syfo-xml-codegen" }
syfo-xml-codegen-kith-apprec = { module = "no.nav.helse.xml:kith-apprec", version.ref = "syfo-xml-codegen" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxb-api" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb-runtime" }
jaxb-java-time-adapters = { module = "com.migesok:jaxb-java-time-adapters", version.ref = "java-time-adapter" }
tsm-sykmeldinger-input = { module = "no.nav.tsm.sykmelding:input", version.ref = "tsm-sykmeldinger-input" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
