apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: migrator
  namespace: tsm
  labels:
    team: tsm
    system: mottak
spec:
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  replicas:
    min: 1
    max: 10
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
      kafka:
        consumerGroup: sykmelding-reformat-consumer
        threshold: 50
        topic: tsm.teamsykmelding-sykmeldinger
  port: 8080
  liveness:
    path: /internal/health/alive
  readiness:
    path: /internal/health/ready
  preStopHook:
    http:
      path: /internal/shutdown
  prometheus:
    enabled: true
    path: /internal/metrics
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 512Mi
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: tsm-pdl-cache
  envFrom:
    - secret: tsm-migrator-smregister-db

